  <meta charset="utf-8">

  <meta name="theme-color" content="#111111">
  <title>LÃ¤genhet 434</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#111111;
      --panel:#1b1b1b;
      --panel2:#242424;
      --text:#f3f3f3;
      --muted:#9a9a9a;
      --line:#353535;
      --guest:#1da1f2;
      --owner:#ff9f00;
      --today:#00a9e8;
      --ok:#4caf50;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    .wrap{max-width:720px;margin:0 auto;padding:12px 16px 40px}
    h1{margin:0 0 18px;font-size:30px;font-weight:800;letter-spacing:-.02em}
    .toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
    .status{display:flex;align-items:center;gap:8px;color:#ddd;font-weight:650;font-size:14px;white-space:nowrap}
    .dot{width:11px;height:11px;border-radius:50%;background:#666}
    .dot.on{background:var(--ok);box-shadow:0 0 10px rgba(76,175,80,.55)}
    .summary{border:1px solid var(--line);border-radius:28px;padding:24px 18px 18px;background:var(--panel);margin-bottom:26px}
    .stats{display:grid;grid-template-columns:1fr 1px 1fr;align-items:center;gap:16px}
    .divider{height:108px;background:var(--line)}
    .statrow{display:flex;align-items:center;gap:12px}
    .iconball{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:38px;flex:0 0 auto}
    .guestball{background:rgba(29,161,242,.18)}
    .ownerball{background:rgba(255,159,0,.18)}
    .label{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
    .guest .label,.guest .value{color:var(--guest)}
    .owner .label,.owner .value{color:var(--owner)}
    .value{font-size:52px;line-height:.95;font-weight:800;margin-top:3px}
    .summarymonth{text-align:center;color:#9d9d9d;font-size:20px;margin-top:14px}
    .calhead{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;margin:4px 0 12px}
    .navbtn{border:0;background:transparent;color:var(--text);font-size:38px;line-height:1;padding:6px;cursor:pointer}
    .month{text-align:center;font-size:31px;font-weight:800;text-transform:capitalize}
    .todaywrap{text-align:center;margin-bottom:22px}
    .todaybtn{border:0;border-radius:16px;background:var(--panel2);color:var(--text);font-size:18px;padding:12px 24px;cursor:pointer}
    .weekdays,.weekrow{display:grid;grid-template-columns:54px repeat(7,1fr);gap:7px;align-items:stretch}
    .weekdays{margin-bottom:8px}
    .weekdays div{text-align:center;color:#a3a3a3;font-size:18px;padding:6px 0}
    .weekdays .weeklabel{font-weight:700;color:#777}
    .calendar{display:grid;gap:9px}
    .weeknum{color:#777;font-weight:750;font-size:15px;display:flex;align-items:flex-start;justify-content:center;padding-top:12px}
    .day{min-height:104px;border-radius:18px;background:var(--panel2);border:2px solid transparent;position:relative;padding:10px 8px;overflow:hidden}
    .day.outside{opacity:0;pointer-events:none}
    .day.today{border-color:var(--today)}
    .day.gast{background:linear-gradient(180deg,rgba(29,161,242,.28),var(--panel2) 72%)}
    .day.agare{background:linear-gradient(180deg,rgba(255,159,0,.26),var(--panel2) 72%)}
    .daynum{font-size:26px;line-height:1;position:relative;z-index:2}
    .badge{position:absolute;left:8px;right:8px;bottom:8px;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .gast .badge{color:var(--guest)}
    .agare .badge{color:var(--owner)}
    .legend{display:flex;gap:24px;justify-content:center;align-items:center;font-weight:750;font-size:18px;margin:26px 0 30px}
    .legend .g{color:var(--guest)}
    .legend .o{color:var(--owner)}
    .yearcard{border:1px solid var(--line);border-radius:28px;overflow:hidden;background:var(--panel)}
    .yearhead{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;padding:24px 24px 18px;border-bottom:1px solid var(--line)}
    .yeartitle{font-size:27px;font-weight:800}
    .yearsub{color:#aaa;font-size:18px;margin-top:3px}
    .yearnav{display:flex;align-items:center;gap:10px}
    .yearbox{min-width:116px;text-align:center;border-radius:16px;background:var(--panel2);padding:13px 18px;font-size:23px;font-weight:800}
    .yeararrow{border:0;background:transparent;color:var(--text);font-size:32px;cursor:pointer;padding:2px 6px}
    .tablehead,.monthrow{display:grid;grid-template-columns:140px 1fr 44px 1fr 44px 44px;align-items:center;gap:8px}
    .tablehead{padding:16px 14px;color:#9d9d9d;font-size:14px;font-weight:800;border-bottom:1px solid var(--line)}
    .monthrow{min-height:74px;padding:12px 14px;border-bottom:1px solid var(--line)}
    .monthrow:last-child{border-bottom:0}
    .monthrow.current{background:#20303c;box-shadow:inset 5px 0 0 #1da1f2}
    .monthname{font-size:20px;font-weight:800}
    .bar{height:18px;border-radius:999px;background:#272727;overflow:hidden}
    .fill{height:100%;border-radius:999px;width:0}
    .guestfill{background:var(--guest)}
    .ownerfill{background:var(--owner)}
    .num{text-align:right;font-size:18px;font-variant-numeric:tabular-nums}
    .tot{font-weight:800}
    .updated{color:#777;text-align:center;font-size:12px;margin-top:16px}
    .error{display:none;margin-top:14px;padding:12px;border-radius:12px;background:#3d1515;color:#ffd0d0}
    .day:not(.outside){cursor:pointer}
    .modal{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.72);align-items:center;justify-content:center;padding:18px}
    .modal.open{display:flex}
    .modalbox{width:min(630px,100%);max-height:88vh;overflow:auto;background:#1b1b1b;border-radius:28px;padding:28px 24px;border:1px solid #353535}
    .modaltitle{font-size:30px;font-weight:800;margin-bottom:8px}
    .modalsub{font-size:20px;color:#aaa;margin-bottom:24px}
    .eventbox{border:1px solid #444;border-radius:22px;background:#242424;padding:20px}
    .period{color:#aaa;font-size:17px;margin-bottom:22px}
    .eventtitle{font-size:20px;font-weight:800;margin-bottom:14px}
    .eventrow{display:grid;grid-template-columns:92px 1fr;gap:10px;font-size:19px;padding:7px 0}
    .eventtime{font-weight:800}.estimated{color:#999}
    .korttid{border-top:1px solid #444;margin-top:14px;padding-top:16px;font-size:20px;font-weight:800}
    .closebtn{width:100%;border:0;background:transparent;color:#aaa;font-size:20px;padding:22px 0 4px;cursor:pointer}
    @media(max-width:560px){
      .wrap{padding:10px 16px 34px}
      h1{font-size:28px}
      .summary{padding:20px 16px 16px}
      .iconball{width:66px;height:66px;font-size:34px}
      .value{font-size:48px}
      .month{font-size:28px}
      .weekdays,.weekrow{grid-template-columns:50px repeat(7,1fr);gap:7px}
      .day{min-height:102px;border-radius:17px;padding:10px 8px}
      .daynum{font-size:25px}
      .badge{font-size:13px}
      .tablehead,.monthrow{grid-template-columns:110px 1fr 34px 1fr 34px 34px;gap:6px}
      .monthname{font-size:18px}
      .yearhead{padding:20px 18px 16px}
    }
    @media(max-width:410px){
      .weekdays,.weekrow{grid-template-columns:42px repeat(7,1fr);gap:5px}
      .day{min-height:90px;border-radius:15px;padding:8px 6px}
      .daynum{font-size:22px}
      .badge{font-size:11px;left:5px;right:5px;bottom:7px}
      .tablehead,.monthrow{grid-template-columns:94px 1fr 28px 1fr 28px 30px;gap:5px;padding-left:10px;padding-right:10px}
      .monthname{font-size:17px}
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="toprow">
    <h1>GÃ¤st- och Ã¤garnÃ¤tter</h1>
    <div class="status">
      <span id="dot" class="dot"></span>
      <span id="statusText">Ingen data</span>
    </div>
  </div>

  <div class="summary">
    <div class="stats">
      <div class="statrow guest">
        <div class="iconball guestball">ðŸ‘¤</div>
        <div>
          <div class="label">GÃ¤stnÃ¤tter</div>
          <div class="value" id="guestCount">0</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="statrow owner">
        <div class="iconball ownerball">ðŸ </div>
        <div>
          <div class="label">Ã„garnÃ¤tter</div>
          <div class="value" id="ownerCount">0</div>
        </div>
      </div>
    </div>
    <div class="summarymonth" id="summaryMonth"></div>
  </div>

  <div class="calhead">
    <button class="navbtn" id="prev">â€¹</button>
    <div class="month" id="month"></div>
    <button class="navbtn" id="next">â€º</button>
  </div>
  <div class="todaywrap"><button class="todaybtn" id="today">Idag</button></div>

  <div class="weekdays">
    <div class="weeklabel">v</div>
    <div>MÃ¥n</div><div>Tis</div><div>Ons</div><div>Tor</div><div>Fre</div><div>LÃ¶r</div><div>SÃ¶n</div>
  </div>
  <div class="calendar" id="calendar"></div>

  <div class="legend">
    <span class="g">ðŸ‘¤ GÃ¤stnatt</span>
    <span class="o">ðŸ  Ã„garnatt</span>
  </div>

  <div class="yearcard">
    <div class="yearhead">
      <div>
        <div class="yeartitle">Ã…rsÃ¶versikt</div>
        <div class="yearsub">Totalt antal nÃ¤tter per mÃ¥nad</div>
      </div>
      <div class="yearnav">
        <button class="yeararrow" id="yearPrev">â€¹</button>
        <div class="yearbox" id="yearLabel"></div>
        <button class="yeararrow" id="yearNext">â€º</button>
      </div>
    </div>
    <div class="tablehead">
      <div>MÃ¥nad</div><div>ðŸ‘¤ GÃ¤st</div><div></div><div>ðŸ  Ã„gare</div><div></div><div>Tot.</div>
    </div>
    <div id="yearRows"></div>
  </div>

  <div class="updated" id="updated">VÃ¤ntar pÃ¥ data</div>

</div>


<div class="modal" id="nightModal">
 <div class="modalbox">
  <div class="modaltitle" id="modalTitle">Nattens hÃ¤ndelser</div>
  <div class="modalsub" id="modalSub"></div>
  <div class="eventbox">
   <div class="period" id="modalPeriod"></div>
   <div class="eventtitle">HÃ¤ndelser som berÃ¤knar natten</div>
   <div id="modalEvents"></div>
   <div class="korttid" id="modalKorttid"></div>
  </div>
  <button class="closebtn" id="modalClose">StÃ¤ng</button>
 </div>
</div>

<script>
let data = { natter: [] };
let view = new Date(); view.setDate(1);
let yearView = view.getFullYear();

const months = ['Januari','Februari','Mars','April','Maj','Juni','Juli','Augusti','September','Oktober','November','December'];
const key=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

function isoWeekNumber(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d-y0)/86400000)+1)/7);
}

function monthCounts(y,m){
  let g=0,o=0;
  for(const n of data.natter||[]){
    const d = new Date(String(n.datum).slice(0,10)+'T12:00:00');
    if(d.getFullYear()===y && d.getMonth()===m){
      if(n.typ==='agare') o++; else g++;
    }
  }
  return {g,o};
}

function renderCalendar(){
  const y=view.getFullYear(), m=view.getMonth();
  const fmt=new Intl.DateTimeFormat('sv-SE',{month:'long',year:'numeric'});
  const title=fmt.format(view);
  month.textContent=title;
  summaryMonth.textContent=title.charAt(0).toUpperCase()+title.slice(1);

  const c=monthCounts(y,m);
  guestCount.textContent=c.g;
  ownerCount.textContent=c.o;

  const map=new Map((data.natter||[]).map(n=>[String(n.datum).slice(0,10),n]));
  const first=new Date(y,m,1);
  const last=new Date(y,m+1,0);
  const start=new Date(first);
  start.setDate(first.getDate()-((first.getDay()+6)%7));
  const end=new Date(last);
  end.setDate(last.getDate()+(7-((last.getDay()+6)%7)-1));

  const todayD=new Date();
  const todayK=key(todayD.getFullYear(),todayD.getMonth(),todayD.getDate());

  calendar.innerHTML='';
  let cur=new Date(start);
  while(cur<=end){
    const row=document.createElement('div');
    row.className='weekrow';

    const wn=document.createElement('div');
    wn.className='weeknum';
    wn.textContent='v'+isoWeekNumber(cur);
    row.appendChild(wn);

    for(let i=0;i<7;i++){
      const d=new Date(cur);
      d.setDate(cur.getDate()+i);
      const k=key(d.getFullYear(),d.getMonth(),d.getDate());
      const n=map.get(k);
      const cell=document.createElement('div');
      const outside=d.getMonth()!==m;
      cell.className='day'+(outside?' outside':'')+(k===todayK?' today':'')+(n?' '+(n.typ==='agare'?'agare':'gast'):'');
      if(!outside){
        cell.innerHTML=`<div class="daynum">${d.getDate()}</div>` + (n?`<div class="badge">${n.typ==='agare'?'ðŸ  Ã„gare':'ðŸ‘¤ GÃ¤st'}${n.preliminar?' Â· pÃ¥gÃ¥r':''}</div>`:'');
        if(n) cell.onclick=()=>openNight(n,d);
      }
      row.appendChild(cell);
    }
    calendar.appendChild(row);
    cur.setDate(cur.getDate()+7);
  }
}

function renderYear(){
  yearLabel.textContent=yearView;
  yearRows.innerHTML='';

  const counts=Array.from({length:12},(_,m)=>monthCounts(yearView,m));
  const max=Math.max(1,...counts.flatMap(x=>[x.g,x.o]));
  const now=new Date();

  counts.forEach((c,m)=>{
    const row=document.createElement('div');
    row.className='monthrow'+(yearView===now.getFullYear() && m===now.getMonth()?' current':'');
    const gp=Math.round(c.g/max*100);
    const op=Math.round(c.o/max*100);
    row.innerHTML=`
      <div class="monthname">${months[m]}</div>
      <div class="bar"><div class="fill guestfill" style="width:${gp}%"></div></div>
      <div class="num">${c.g}</div>
      <div class="bar"><div class="fill ownerfill" style="width:${op}%"></div></div>
      <div class="num">${c.o}</div>
      <div class="num tot">${c.g+c.o}</div>`;
    yearRows.appendChild(row);
  });
}


function openNight(n,d){
  modalSub.textContent=`LÃ¤genhet 434 Â· ${d.getDate()} ${months[d.getMonth()].toLowerCase()} ${d.getFullYear()}`;
  const e=new Date(d); e.setDate(e.getDate()+1);
  modalPeriod.textContent=`Period: ${d.getDate()} ${months[d.getMonth()].slice(0,3).toLowerCase()}. 15:00 â€“ ${e.getDate()} ${months[e.getMonth()].slice(0,3).toLowerCase()}. 12:00`;
  const events=n.handelser||n.events||n['hÃ¤ndelser']||n.detaljer||[];
  modalEvents.innerHTML='';
  if(Array.isArray(events)&&events.length){
    events.forEach(x=>{
      const row=document.createElement('div'); row.className='eventrow';
      const raw=x.tid||x.time||x.timestamp||'';
      let t=String(raw); const mm=t.match(/(?:T|\\s)(\\d{2}:\\d{2})/); if(mm)t=mm[1];
      const text=x.text||x.typ||x.type||x.handelse||x['hÃ¤ndelse']||x.status||'HÃ¤ndelse';
      row.innerHTML=`<div class="eventtime">${t}</div><div>${text}${(x.uppskattad||x.estimated)?' <span class="estimated">Â· uppskattad</span>':''}</div>`;
      modalEvents.appendChild(row);
    });
  } else modalEvents.innerHTML='<div class="estimated">Inga detaljerade hÃ¤ndelser finns fÃ¶r natten.</div>';
  const kt=n.korttid||n.kort_tid||n.duration||n.beraknad_korttid;
  modalKorttid.textContent=kt?`BerÃ¤knad korttid: ${kt}`:`${n.typ==='agare'?'ðŸ  Ã„garnatt':'ðŸ‘¤ GÃ¤stnatt'}${n.preliminar?' Â· pÃ¥gÃ¥r':''}`;
  nightModal.classList.add('open');
}
modalClose.onclick=()=>nightModal.classList.remove('open');
nightModal.onclick=e=>{if(e.target===nightModal)nightModal.classList.remove('open');};

function render(){ renderCalendar(); renderYear(); }

async function load(){
  try{
    const r=await fetch('https://dblgbnfpdbbsafzdeooc.supabase.co/functions/v1/public-434',{cache:'no-store'});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    data=await r.json();

    const on=String(data.status||'').toLowerCase()==='on';
    dot.className='dot'+(on?' on':'');
    statusText.textContent=on?'KortstrÃ¶m aktiv':'KortstrÃ¶m av';

    updated.textContent=data.uppdaterad
      ? `Senast uppdaterad ${new Date(data.uppdaterad).toLocaleString('sv-SE')}`
      : 'Ingen uppdatering Ã¤nnu';

    error.style.display='none';
    render();
  }catch(err){
    error.textContent='Kunde inte hÃ¤mta data: '+err.message;
    error.style.display='block';
  }
}

prev.onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);yearView=view.getFullYear();render();}
next.onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);yearView=view.getFullYear();render();}
today.onclick=()=>{view=new Date();view.setDate(1);yearView=view.getFullYear();render();}
yearPrev.onclick=()=>{yearView--;renderYear();}
yearNext.onclick=()=>{yearView++;renderYear();}

load();
setInterval(load,30000);
</script>
