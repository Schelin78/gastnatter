<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Lägenhet 434</title><style>
:root{color-scheme:dark;--bg:#0b1020;--card:#121a2b;--card2:#182238;--text:#f8fafc;--muted:#9aa7bd;--guest:#60a5fa;--owner:#f59e0b;--ok:#34d399;--line:#26344f}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b1020,#101827);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 40px}.card{background:rgba(18,26,43,.94);border:1px solid var(--line);border-radius:22px;padding:18px}.head{display:flex;gap:14px;align-items:center;justify-content:space-between}h1{margin:0;font-size:28px}.sub{color:var(--muted);margin-top:4px}.status{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:999px;background:var(--card2);font-weight:650}.dot{width:10px;height:10px;border-radius:50%;background:#64748b}.dot.on{background:var(--ok);box-shadow:0 0 14px rgba(52,211,153,.65)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.stat{padding:14px;border-radius:16px;background:var(--card2);border:1px solid var(--line)}.stat .label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.stat .value{font-size:34px;font-weight:780;margin-top:4px}.stat.guest .value{color:var(--guest)}.stat.owner .value{color:var(--owner)}.calhead{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:18px 0 8px}.calhead button{border:0;background:transparent;color:var(--text);font-size:28px}.month{text-align:center;font-size:20px;font-weight:700;text-transform:capitalize}.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekdays div{text-align:center;color:var(--muted);font-size:12px;padding:5px 0}.day{min-height:64px;border-radius:12px;background:var(--card2);padding:7px;position:relative;border:1px solid transparent}.day.empty{visibility:hidden}.day.today{border-color:#93c5fd}.day.gast{background:linear-gradient(180deg,rgba(96,165,250,.24),rgba(24,34,56,.92))}.day.agare{background:linear-gradient(180deg,rgba(245,158,11,.23),rgba(24,34,56,.92))}.badge{position:absolute;left:4px;right:4px;bottom:6px;text-align:center;font-size:11px;font-weight:700}.gast .badge{color:var(--guest)}.agare .badge{color:var(--owner)}.legend{display:flex;gap:18px;justify-content:center;color:var(--muted);font-size:13px;margin:12px 0 0}.updated{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}.error{display:none;margin-top:14px;padding:12px;background:#3b1620;border-radius:12px;color:#fecdd3}@media(max-width:460px){.wrap{padding:10px 8px 28px}.card{padding:13px}.head{align-items:flex-start}h1{font-size:23px}.status{font-size:12px}.day{min-height:54px}.badge{font-size:10px}}
</style></head><body><div class="wrap"><div class="card"><div class="head"><div><h1>Lägenhet 434</h1><div class="sub">Gäst- och ägarnätter</div></div><div class="status"><span id="dot" class="dot"></span><span id="statusText">Ingen data</span></div></div><div class="stats"><div class="stat guest"><div class="label">Gästnätter</div><div class="value" id="guestCount">0</div></div><div class="stat owner"><div class="label">Ägarnätter</div><div class="value" id="ownerCount">0</div></div></div><div class="calhead"><button id="prev">‹</button><div class="month" id="month"></div><button id="next">›</button></div><div class="weekdays"><div>Mån</div><div>Tis</div><div>Ons</div><div>Tor</div><div>Fre</div><div>Lör</div><div>Sön</div></div><div class="calendar" id="calendar"></div><div class="legend"><span>👤 Gästnatt</span><span>🏠 Ägarnatt</span></div><div class="updated" id="updated">Väntar på data</div><div class="error" id="error"></div></div></div><script>
let data={natter:[]};let view=new Date();view.setDate(1);const key=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
function render(){const y=view.getFullYear(),m=view.getMonth();month.textContent=new Intl.DateTimeFormat('sv-SE',{month:'long',year:'numeric'}).format(view);const map=new Map((data.natter||[]).map(n=>[String(n.datum).slice(0,10),n]));let g=0,o=0;for(const n of data.natter||[]){const d=new Date(String(n.datum).slice(0,10)+'T12:00:00');if(d.getFullYear()===y&&d.getMonth()===m){n.typ==='agare'?o++:g++}}guestCount.textContent=g;ownerCount.textContent=o;const first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),off=(first.getDay()+6)%7,t=new Date(),tk=key(t.getFullYear(),t.getMonth(),t.getDate());calendar.innerHTML='';for(let i=0;i<off;i++){let e=document.createElement('div');e.className='day empty';calendar.appendChild(e)}for(let d=1;d<=days;d++){const k=key(y,m,d),n=map.get(k),e=document.createElement('div');e.className='day'+(k===tk?' today':'')+(n?' '+(n.typ==='agare'?'agare':'gast'):'');e.innerHTML=`<span>${d}</span>${n?`<span class="badge">${n.typ==='agare'?'🏠 Ägare':'👤 Gäst'}${n.preliminar?' · pågår':''}</span>`:''}`;calendar.appendChild(e)}}
async function load(){try{const r=await fetch('/api/data',{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);data=await r.json();const on=String(data.status||'').toLowerCase()==='on';dot.className='dot'+(on?' on':'');statusText.textContent=on?'Kortström aktiv':'Kortström av';updated.textContent=data.uppdaterad?`Senast uppdaterad ${new Date(data.uppdaterad).toLocaleString('sv-SE')}`:'Ingen uppdatering ännu';error.style.display='none';render()}catch(err){error.textContent='Kunde inte hämta data: '+err.message;error.style.display='block'}}prev.onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};next.onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};load();setInterval(load,30000);
</script></body></html>
