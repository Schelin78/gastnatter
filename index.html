<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <title>Lägenhet 434</title>
  <style>
    :root{color-scheme:dark;--bg:#111318;--card:#1c1f26;--cell:#252932;--line:#353a45;--text:#f5f5f5;--muted:#9ca3af;--guest:#2196f3;--owner:#ff9f0a;--today:#03a9f4;--ok:#51b56d}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
    button{font:inherit}
    .wrap{width:min(100%,760px);margin:auto;padding:14px 14px 44px}
    .toprow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:15px}
    h1{margin:0;font-size:clamp(25px,6vw,32px);line-height:1.08;letter-spacing:-.025em}
    .status{display:flex;align-items:center;gap:7px;color:#d5d5d5;font-size:13px;font-weight:700;white-space:nowrap;padding-top:7px}
    .dot{width:10px;height:10px;border-radius:50%;background:#666;flex:none}.dot.on{background:var(--ok);box-shadow:0 0 9px #51b56d99}
    .summary{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px 16px 15px;margin-bottom:22px}
    .stats{display:grid;grid-template-columns:1fr 1px 1fr;gap:14px;align-items:center}.divider{width:1px;height:84px;background:var(--line)}
    .statrow{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}.iconball{width:58px;height:58px;display:grid;place-items:center;border-radius:50%;font-size:29px;flex:none}
    .guestball{background:#2196f326}.ownerball{background:#ff9f0a26}.label{font-size:11px;font-weight:850;letter-spacing:.055em;text-transform:uppercase}.value{font-size:45px;font-weight:850;line-height:.95;margin-top:4px}
    .guest .label,.guest .value{color:var(--guest)}.owner .label,.owner .value{color:var(--owner)}.summarymonth{text-align:center;color:var(--muted);font-size:17px;margin-top:13px;text-transform:capitalize}
    .calhead{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;margin-bottom:4px}.month{text-align:center;font-size:clamp(26px,7vw,32px);font-weight:850;text-transform:capitalize}.navbtn,.yeararrow{border:0;background:transparent;color:var(--text);font-size:39px;line-height:1;cursor:pointer;padding:5px;border-radius:12px}.navbtn:active,.yeararrow:active{background:var(--cell)}
    .todaywrap{text-align:center;margin:4px 0 17px}.todaybtn{border:0;background:var(--cell);color:var(--text);padding:9px 22px;border-radius:13px;font-size:16px;font-weight:650;cursor:pointer}
    .weekdays,.weekrow{display:grid;grid-template-columns:31px repeat(7,minmax(0,1fr));gap:5px}.weekdays{margin-bottom:6px}.weekdays div{text-align:center;color:#a6a9b0;font-size:14px;padding:3px 0}.weekdays .weeklabel{color:#6f747e;font-weight:750}
    .calendar{display:grid;gap:7px}.weeknum{color:#707580;font-weight:750;font-size:12px;text-align:center;padding-top:10px}.day{aspect-ratio:.76;min-height:67px;position:relative;border:2px solid transparent;border-radius:14px;background:var(--cell);color:var(--text);font:inherit;text-align:left;padding:8px 5px;overflow:hidden}.day.outside{visibility:hidden}.day.today{border-color:var(--today)}.day.has-night{cursor:pointer}.day.gast{background:linear-gradient(180deg,#2196f34d,var(--cell) 72%)}.day.agare{background:linear-gradient(180deg,#ff9f0a47,var(--cell) 72%)}.daynum{font-size:clamp(17px,4.7vw,25px);line-height:1}.badge{position:absolute;left:5px;right:5px;bottom:7px;font-size:clamp(9px,2.2vw,13px);font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gast .badge{color:#62b6fa}.agare .badge{color:#ffb846}
    .legend{display:flex;justify-content:center;gap:22px;margin:22px 0 27px;font-size:16px;font-weight:750}.legend .g{color:var(--guest)}.legend .o{color:var(--owner)}
    .yearcard{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden}.yearhead{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:20px 16px 15px;border-bottom:1px solid var(--line)}.yeartitle{font-size:25px;font-weight:850}.yearsub{color:var(--muted);font-size:14px;margin-top:2px}.yearnav{display:flex;align-items:center}.yearbox{min-width:81px;text-align:center;background:var(--cell);padding:10px 9px;border-radius:13px;font-size:18px;font-weight:850}.yeararrow{font-size:29px;padding:5px}
    .yeartotals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}.yearstat{background:var(--card);text-align:center;padding:12px 5px}.yearstat strong{display:block;font-size:24px}.yearstat span{font-size:11px;color:var(--muted);font-weight:750;text-transform:uppercase}.yearstat.g strong{color:var(--guest)}.yearstat.o strong{color:var(--owner)}
    .tablehead,.monthrow{display:grid;grid-template-columns:92px minmax(28px,1fr) 25px minmax(28px,1fr) 25px 28px;gap:5px;align-items:center}.tablehead{padding:12px 9px;color:var(--muted);font-size:11px;font-weight:800;border-bottom:1px solid var(--line)}.monthrow{min-height:55px;padding:9px;border-bottom:1px solid var(--line)}.monthrow:last-child{border-bottom:0}.monthrow.current{background:#1e3442;box-shadow:inset 4px 0 var(--guest)}.monthname{font-size:15px;font-weight:800}.bar{height:12px;border-radius:99px;background:#292d35;overflow:hidden}.fill{height:100%;border-radius:99px}.guestfill{background:var(--guest)}.ownerfill{background:var(--owner)}.num{text-align:right;font-size:14px;font-variant-numeric:tabular-nums}.tot{font-weight:850}
    .updated{text-align:center;color:#737985;font-size:12px;margin-top:15px}.error{display:none;background:#401c21;color:#ffd4d7;margin-top:12px;padding:12px;border-radius:12px}
    .modal{display:none;position:fixed;inset:0;z-index:20;background:#000b;align-items:flex-end;justify-content:center;padding:12px}.modal.open{display:flex}.modalbox{width:min(100%,630px);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:25px;padding:23px 18px 13px;box-shadow:0 18px 60px #0009}.modaltop{display:flex;justify-content:space-between;gap:12px}.modaltitle{font-size:26px;font-weight:850}.modalsub{color:var(--muted);font-size:16px;margin-top:3px}.xbtn{border:0;background:var(--cell);color:var(--muted);width:37px;height:37px;border-radius:50%;font-size:23px;line-height:1;cursor:pointer;flex:none}.eventbox{margin-top:19px;border:1px solid var(--line);border-radius:18px;background:var(--cell);padding:16px}.period{color:var(--muted);font-size:14px;margin-bottom:17px}.eventtitle{font-size:17px;font-weight:850;margin-bottom:10px}.eventrow{display:grid;grid-template-columns:58px 1fr;gap:9px;padding:9px 0;border-bottom:1px solid #363b45;font-size:15px}.eventrow:last-child{border-bottom:0}.eventtime{font-weight:850;font-variant-numeric:tabular-nums}.eventdesc small{display:block;color:var(--muted);margin-top:2px}.estimated{color:#a8acb4}.korttid{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);margin-top:15px;padding-top:15px;font-size:16px;font-weight:750}.korttid strong{font-size:22px;color:var(--text)}.nighttype{margin-top:13px;font-weight:800}.nighttype.gast{color:var(--guest)}.nighttype.agare{color:var(--owner)}.closebtn{width:100%;border:0;background:transparent;color:#b4b6bc;font-size:17px;padding:18px 0 5px;cursor:pointer}
    @media(min-width:560px){.wrap{padding:18px 18px 48px}.day{min-height:94px;aspect-ratio:auto}.weekdays,.weekrow{grid-template-columns:43px repeat(7,minmax(0,1fr));gap:7px}.weekdays div{font-size:16px}.tablehead,.monthrow{grid-template-columns:125px 1fr 36px 1fr 36px 38px;gap:8px;padding-left:14px;padding-right:14px}.monthname{font-size:18px}.modal{align-items:center}.modalbox{padding:27px 23px 15px}}
    @media(max-width:380px){.wrap{padding-left:8px;padding-right:8px}.stats{gap:7px}.statrow{gap:6px}.iconball{width:48px;height:48px;font-size:24px}.value{font-size:38px}.weekdays,.weekrow{grid-template-columns:27px repeat(7,minmax(0,1fr));gap:3px}.day{border-radius:11px;padding:7px 4px}.badge{left:4px;right:4px;font-size:8px}.tablehead,.monthrow{grid-template-columns:78px minmax(22px,1fr) 22px minmax(22px,1fr) 22px 25px;gap:3px}.monthname{font-size:13px}}
  </style>
</head>
<body>
<main class="wrap">
  <div class="toprow"><h1>Gäst- och ägarnätter</h1><div class="status"><span id="dot" class="dot"></span><span id="statusText">Ingen data</span></div></div>
  <section class="summary" aria-label="Månadsstatistik"><div class="stats"><div class="statrow guest"><div class="iconball guestball">👤</div><div><div class="label">Gästnätter</div><div class="value" id="guestCount">0</div></div></div><div class="divider"></div><div class="statrow owner"><div class="iconball ownerball">🏠</div><div><div class="label">Ägarnätter</div><div class="value" id="ownerCount">0</div></div></div></div><div class="summarymonth" id="summaryMonth"></div></section>
  <div class="calhead"><button class="navbtn" id="prev" aria-label="Föregående månad">‹</button><div class="month" id="month"></div><button class="navbtn" id="next" aria-label="Nästa månad">›</button></div>
  <div class="todaywrap"><button class="todaybtn" id="today">Idag</button></div>
  <div class="weekdays"><div class="weeklabel">v</div><div>Mån</div><div>Tis</div><div>Ons</div><div>Tor</div><div>Fre</div><div>Lör</div><div>Sön</div></div>
  <div class="calendar" id="calendar"></div>
  <div class="legend"><span class="g">👤 Gästnatt</span><span class="o">🏠 Ägarnatt</span></div>
  <section class="yearcard"><div class="yearhead"><div><div class="yeartitle">Årsöversikt</div><div class="yearsub">Totalt antal nätter per månad</div></div><div class="yearnav"><button class="yeararrow" id="yearPrev" aria-label="Föregående år">‹</button><div class="yearbox" id="yearLabel"></div><button class="yeararrow" id="yearNext" aria-label="Nästa år">›</button></div></div><div class="yeartotals"><div class="yearstat g"><strong id="yearGuest">0</strong><span>Gäst</span></div><div class="yearstat o"><strong id="yearOwner">0</strong><span>Ägare</span></div><div class="yearstat"><strong id="yearTotal">0</strong><span>Totalt</span></div></div><div class="tablehead"><div>Månad</div><div>👤 Gäst</div><div></div><div>🏠 Ägare</div><div></div><div>Tot.</div></div><div id="yearRows"></div></section>
  <div class="updated" id="updated">Väntar på data</div><div class="error" id="error"></div>
</main>
<div class="modal" id="nightModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalbox"><div class="modaltop"><div><div class="modaltitle" id="modalTitle">Nattens händelser</div><div class="modalsub" id="modalSub"></div></div><button class="xbtn" id="modalX" aria-label="Stäng">×</button></div><div class="eventbox"><div class="period" id="modalPeriod"></div><div class="eventtitle">Händelser som beräknar natten</div><div id="modalEvents"></div><div class="korttid"><span>Beräknad korttid</span><strong id="modalKorttid">–</strong></div><div class="nighttype" id="modalType"></div></div><button class="closebtn" id="modalClose">Stäng</button></div></div>
<script>
  const PUBLIC_434_URL='https://dblgbnfpdbbsafzdeooc.supabase.co/functions/v1/public-434';
  let data={natter:[]};let view=new Date();view.setDate(1);let yearView=view.getFullYear();
  const months=['Januari','Februari','Mars','April','Maj','Juni','Juli','Augusti','September','Oktober','November','December'];
  const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');const dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  function parseDate(value){const m=String(value||'').slice(0,10).match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?new Date(+m[1],+m[2]-1,+m[3],12):null}
  function isoWeekNumber(date){const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);const y0=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-y0)/86400000)+1)/7)}
  function monthCounts(y,m){let g=0,o=0;for(const n of data.natter||[]){const d=parseDate(n.datum);if(d&&d.getFullYear()===y&&d.getMonth()===m)(n.typ==='agare'?o++:g++)}return{g,o}}
  function renderCalendar(){const y=view.getFullYear(),m=view.getMonth(),title=new Intl.DateTimeFormat('sv-SE',{month:'long',year:'numeric'}).format(view),c=monthCounts(y,m);$('month').textContent=title;$('summaryMonth').textContent=title;$('guestCount').textContent=c.g;$('ownerCount').textContent=c.o;const map=new Map((data.natter||[]).map(n=>[String(n.datum).slice(0,10),n]));const first=new Date(y,m,1),last=new Date(y,m+1,0),start=new Date(first),end=new Date(last);start.setDate(first.getDate()-((first.getDay()+6)%7));end.setDate(last.getDate()+(6-(last.getDay()+6)%7));$('calendar').replaceChildren();for(let cur=new Date(start);cur<=end;cur.setDate(cur.getDate()+7)){const row=document.createElement('div');row.className='weekrow';const wn=document.createElement('div');wn.className='weeknum';wn.textContent=`v${isoWeekNumber(cur)}`;row.append(wn);for(let i=0;i<7;i++){const d=new Date(cur);d.setDate(cur.getDate()+i);const n=map.get(dateKey(d)),cell=document.createElement(n?'button':'div'),outside=d.getMonth()!==m,isToday=dateKey(d)===dateKey(new Date());cell.className=`day${outside?' outside':''}${isToday?' today':''}${n?' has-night '+(n.typ==='agare'?'agare':'gast'):''}`;if(n){cell.type='button';cell.setAttribute('aria-label',`${d.getDate()} ${months[m]}, ${n.typ==='agare'?'ägarnatt':'gästnatt'}`);cell.addEventListener('click',()=>openNight(n,d))}if(!outside){const num=document.createElement('div');num.className='daynum';num.textContent=d.getDate();cell.append(num);if(n){const badge=document.createElement('div');badge.className='badge';badge.textContent=`${n.typ==='agare'?'🏠 Ägare':'👤 Gäst'}${n.preliminar?' · pågår':''}`;cell.append(badge)}}row.append(cell)}$('calendar').append(row)}}
  function renderYear(){const counts=Array.from({length:12},(_,m)=>monthCounts(yearView,m)),max=Math.max(1,...counts.flatMap(c=>[c.g,c.o])),now=new Date();$('yearLabel').textContent=yearView;$('yearRows').replaceChildren();$('yearGuest').textContent=counts.reduce((s,c)=>s+c.g,0);$('yearOwner').textContent=counts.reduce((s,c)=>s+c.o,0);$('yearTotal').textContent=counts.reduce((s,c)=>s+c.g+c.o,0);counts.forEach((c,m)=>{const row=document.createElement('div');row.className=`monthrow${yearView===now.getFullYear()&&m===now.getMonth()?' current':''}`;row.innerHTML=`<div class="monthname">${months[m]}</div><div class="bar"><div class="fill guestfill" style="width:${Math.round(c.g/max*100)}%"></div></div><div class="num">${c.g}</div><div class="bar"><div class="fill ownerfill" style="width:${Math.round(c.o/max*100)}%"></div></div><div class="num">${c.o}</div><div class="num tot">${c.g+c.o}</div>`;$('yearRows').append(row)})}
  function rawEvents(n){for(const key of ['handelser','händelser','events','detaljer'])if(Array.isArray(n[key]))return n[key];return[]}
  function eventTime(x){const raw=x.tid??x.time??x.timestamp??x.datum??'';const match=String(raw).match(/(?:T|\s)?(\d{1,2}:\d{2})/);return match?match[1].padStart(5,'0'):'–'}
  function eventText(x){return String(x.text??x.beskrivning??x.handelse??x.händelse??x.typ??x.type??x.status??'Korthändelse')}
  function isEstimated(x){return Boolean(x.uppskattad??x.estimated??x.preliminar)}
  function formatHours(value){const h=Number(value);if(!Number.isFinite(h))return'–';const total=Math.round(h*60),hours=Math.floor(total/60),minutes=total%60;return `${hours} h ${pad(minutes)} min`}
  function appendEvent(time,text,estimated=false){const row=document.createElement('div');row.className='eventrow';const t=document.createElement('div');t.className='eventtime';t.textContent=time;const desc=document.createElement('div');desc.className='eventdesc';desc.textContent=text;if(estimated){const note=document.createElement('small');note.textContent='Uppskattad händelse';desc.append(note)}row.append(t,desc);$('modalEvents').append(row)}
  function estimatedEvents(n,start,end){const hours=Number(n.timmar??n.korttid??n.beraknad_korttid);appendEvent('15:00','Nattens beräkningsperiod börjar',true);if(Number.isFinite(hours)){const finish=new Date(start.getTime()+Math.min(hours,21)*3600000);appendEvent(`${pad(finish.getHours())}:${pad(finish.getMinutes())}`,'Beräknad sammanlagd korttid uppnådd',true)}appendEvent('12:00','Nattens beräkningsperiod slutar',true)}
  function openNight(n,d){const end=new Date(d);end.setDate(end.getDate()+1);const periodStart=new Date(d);periodStart.setHours(15,0,0,0);$('modalSub').textContent=`Lägenhet 434 · ${d.getDate()} ${months[d.getMonth()].toLowerCase()} ${d.getFullYear()}`;$('modalPeriod').textContent=`Period: ${d.getDate()} ${months[d.getMonth()].slice(0,3).toLowerCase()}. 15:00 – ${end.getDate()} ${months[end.getMonth()].slice(0,3).toLowerCase()}. 12:00`;$('modalEvents').replaceChildren();const events=rawEvents(n);if(events.length)events.forEach(x=>appendEvent(eventTime(x),eventText(x),isEstimated(x)));else estimatedEvents(n,periodStart,end);$('modalKorttid').textContent=formatHours(n.timmar??n.korttid??n.kort_tid??n.duration??n.beraknad_korttid);$('modalType').className=`nighttype ${n.typ==='agare'?'agare':'gast'}`;$('modalType').textContent=`${n.typ==='agare'?'🏠 Ägarnatt':'👤 Gästnatt'}${n.preliminar?' · preliminär/pågår':''}`;$('nightModal').classList.add('open');$('modalX').focus()}
  function closeModal(){$('nightModal').classList.remove('open')}
  function render(){renderCalendar();renderYear()}
  async function load(){try{const r=await fetch(PUBLIC_434_URL,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const incoming=await r.json();data={...incoming,natter:Array.isArray(incoming.natter)?incoming.natter:[]};const on=String(data.status||'').toLowerCase()==='on';$('dot').className=`dot${on?' on':''}`;$('statusText').textContent=on?'Kortström aktiv':'Kortström av';$('updated').textContent=data.uppdaterad?`Senast uppdaterad ${new Date(data.uppdaterad).toLocaleString('sv-SE')}`:'Ingen uppdatering ännu';$('error').style.display='none';render()}catch(err){$('error').textContent=`Kunde inte hämta data: ${err.message}`;$('error').style.display='block'}}
  $('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);yearView=view.getFullYear();render()};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);yearView=view.getFullYear();render()};$('today').onclick=()=>{view=new Date();view.setDate(1);yearView=view.getFullYear();render()};$('yearPrev').onclick=()=>{yearView--;renderYear()};$('yearNext').onclick=()=>{yearView++;renderYear()};$('modalClose').onclick=closeModal;$('modalX').onclick=closeModal;$('nightModal').onclick=e=>{if(e.target===$('nightModal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
  render();load();setInterval(load,30000);
</script>
</body>
</html>
